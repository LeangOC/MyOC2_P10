spring:

  application:
    name: ycyw-chat-poc

  config:
    import : optional:file:.env[.properties]


  datasource:
    #url: jdbc:postgresql://localhost:5432/ycyw_chat
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: UTC

server:
  port: 8080

logging:
  level:
    com.ycyw.chatpoc: INFO

springdoc:

  api-docs:
    path: /api-docs

  springdoc:
    swagger-ui.path: /swagger-ui.html