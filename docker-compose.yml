services:

  postgres:
    image: postgres:17

    container_name: ycyw-chat-postgres

    environment:
      POSTGRES_DB: ycyw_chat
      POSTGRES_USER: ycyw
      POSTGRES_PASSWORD: ycyw_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ycyw -d ycyw_chat"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:

  postgres_data: