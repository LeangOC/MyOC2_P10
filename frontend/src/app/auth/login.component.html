<main class="login-container">
  <section
    class="login-card"
    aria-labelledby="login-title">
    <h1 id="login-title">
      Your Car Your Way
    </h1>

    <h2>
      Connexion
    </h2>

    <form
      (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">
          Adresse e-mail
        </label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <label for="password">
          Mot de passe
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required>
      </div>

      @if (errorMessage) {
      <p
        class="error"
        role="alert">
        {{ errorMessage }}
      </p>

      }

      <button
        type="submit"
        [disabled]="loading || !email || !password">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </form>
  </section>

</main>
